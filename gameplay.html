<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5efe6">
<title data-i18n="siteTitle">ŞİFAHİ HESABLAMA</title>
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<main class="app gameplay-page">
  <section class="screen active">
    <div class="intro game-main-intro gameplay-intro">
    <div class="game-topbar">
      <button type="button" class="home-button" id="quit" data-i18n-aria-label="menuAria" aria-label="Əsas səhifə">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 10.7 12 4l8.2 6.7v8.5a.8.8 0 0 1-.8.8h-4.6v-5.6H9.2V20H4.6a.8.8 0 0 1-.8-.8z"/><path d="M9.2 20v-5.6h5.6V20"/></svg>
      </button>
      <strong class="mode-title" id="modeName">Toplama və Çıxma</strong>
      <div class="topbar-right" aria-hidden="true"></div>
    </div>

    <div class="progress-row">
      <div class="progress"><div id="progress"></div></div>
      <div class="board-time progress-time hidden" id="boardTime" aria-live="polite">
        <svg class="alarm-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.6v4.8l3 1.8"/><path d="M7 4.6 5.2 3.2M17 4.6l1.8-1.4"/></svg>
        <b><span id="time">60</span>s</b>
      </div>
      <div class="question-count" id="counter" aria-hidden="true">0</div>
    </div>

    <div class="chalkboard-wrap">
      <div class="board-frame">
        <div class="chalkboard">
          <div class="question" id="question"></div>
          <div id="feedback" class="feedback" aria-live="polite"></div>
          <div class="chalk-dust dust-1"></div>
          <div class="chalk-dust dust-2"></div>
          <div class="chalk-dust dust-3"></div>
        </div>
        <div class="chalk-tray"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="options waiting" id="options" aria-label="Cavab variantları">
      <button type="button" class="option" data-index="0"><span>A</span><strong></strong></button>
      <button type="button" class="option" data-index="1"><span>B</span><strong></strong></button>
      <button type="button" class="option" data-index="2"><span>C</span><strong></strong></button>
      <button type="button" class="option" data-index="3"><span>D</span><strong></strong></button>
    </div>
    </div>
  </section>
</main>
<script src="JS/lang.js" defer></script>
<script src="JS/gameplay.js" defer></script>
<script src="JS/protection.js" defer></script>
</body>
</html>
